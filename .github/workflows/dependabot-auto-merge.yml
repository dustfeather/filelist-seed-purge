name: Dependabot auto-merge

on:
    pull_request_review:
        types: [submitted]

permissions:
    contents: read

# Serialise per PR: an approval burst (or a re-run of the upstream workflow)
# must not start a second merge of the same PR while the first is still in
# flight. No `cancel-in-progress` on purpose — unlike the review workflows this
# one performs a merge, and killing a run mid-merge leaves the PR in a state
# nothing retries. Queueing costs a little time; cancelling costs correctness.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}

jobs:
    merge:
        permissions:
            contents: write
            pull-requests: write
            # Granted ahead of the callee requesting it. shared-workflows'
            # dependabot-auto-merge closes the PR's linked issues itself after a
            # `direct` merge, and that write needs this scope — without it a merged
            # `Closes #N` stores the link and silently never closes.
            #
            # A caller may always grant MORE than the callee asks; a callee asking
            # for more than the caller grants is a startup_failure with zero jobs and
            # an empty `--log-failed`. So this lands FIRST, in every caller, before
            # the scope is added to the reusable workflow.
            issues: write
        uses: dustfeather/shared-workflows/.github/workflows/dependabot-auto-merge.yml@v6
        with:
            runner: arc-df-filelist-seed-purge
